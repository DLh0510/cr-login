name: Build Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            ext: .exe
          - os: macos-latest
            name: macOS
            ext: ""
          - os: ubuntu-latest
            name: Linux
            ext: ""

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build
        run: pyinstaller --onefile --windowed --name "CloudRaiser-Login" login_client.py
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CloudRaiser-Login-${{ matrix.name }}
          path: dist/CloudRaiser-Login${{ matrix.ext }}
