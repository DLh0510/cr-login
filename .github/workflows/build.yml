name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "CloudRaiser-Login" --icon "icon.ico" --add-data "yjgj_foot_logo.png;." main.py
      
      - name: Create Installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer.iss
      
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: CloudRaiser-Login-Windows-Installer
          path: Output/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build
        run: pyinstaller --onefile --windowed --name "CloudRaiser-Login" --add-data "yjgj_foot_logo.png:." main.py
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CloudRaiser-Login-macOS
          path: dist/CloudRaiser-Login

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build
        run: pyinstaller --onefile --windowed --name "CloudRaiser-Login" --add-data "yjgj_foot_logo.png:." main.py
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CloudRaiser-Login-Linux
          path: dist/CloudRaiser-Login
